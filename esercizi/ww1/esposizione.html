<html>
    <head>
        <title>Esposizione Dati WW1</title>
    </head>
    <body>
        <select name="morti" id="morti_box">
  
        </select>
        <script>
            let boxer="";
            let xmlhttp = new XMLHttpRequest();
            xmlhttp.open("GET", "https://drive.google.com/file/d/1vPm6Mht2mlBGD1PnFSwXlPW70jIcO4KW/view", true);
            xmlhttp.send();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    let jsonFile = JSON.parse(this.responseText);
                    for(let i = 0; i < jsonFile.length; i++){
                        boxer += "<option value=";
                        boxer += jsonFile.prima_guerra_mondiale.paesi[i].nome + ">" + jsonFile.prima_guerra_mondiale.paesi[i].nome;
                        boxer += "</option>";
                    }
                document.getElementById("morti_box").innerHTML = boxer;
                }
            };
        </script>
    </body>
</html>
